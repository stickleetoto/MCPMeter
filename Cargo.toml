[package]
name = "mcp-meter"
version = "0.1.0"
edition = "2021"
description = "Measure token, traffic, and latency overhead of MCP servers"
license = "MIT"
repository = "https://github.com/stickleetoto/MCPMeter"
rust-version = "1.82"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiktoken-rs = "0.12"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
